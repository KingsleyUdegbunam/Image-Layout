<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="reset.css">

  <link rel="stylesheet" href="style.css">
  <title>Image Layout</title>
</head>

<body>
  <main>
    <section class="grid-parent">
      <article class="image-container grid">
        <div class="image-container row-span-2">
          <img src="images/1.jpg" alt="image of mountain in foggy weather">
        </div>

        <div class="image-container">
          <img class="landscape-orient" src="images/2.png" alt="a table topped with plates and bowls of food">
        </div>

        <div class="image-container row-span-2">
          <img src="images/3.jpg" alt="A row of white apartment buildings nex
          
          t to a street">
        </div>

        <div class="image-container orient-1">
          <img class="landscape-orient " src="images/4.jpg" alt="A living room with a white couch and a round window">
        </div>

        <div class="image-container row-span-2 red-door">
          <img src="images/5.jpg" alt="A building with a red door and a tree in front of it">
        </div>

        <div class="image-container orient-2">
          <img src="images/6.png" alt="A view of a beach from the top of a hill">
        </div>




      </article>
    </section>

  </main>
</body>

</html>
